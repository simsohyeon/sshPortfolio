name: Deploy Cloudflare Worker

# api/ 또는 챗봇 데이터(src/data/resume.js)가 바뀌면 Worker 를 다시 배포한다.
# 필요한 시크릿: CLOUDFLARE_API_TOKEN (Settings > Secrets and variables > Actions > Secrets). 발급 방법은 api/README.md "배포" 참고.
# GEMINI_API_KEY 는 Cloudflare 에 이미 등록된 Worker 시크릿이라 여기서 다루지 않는다.
on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "src/data/resume.js"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22   # wrangler 4 는 Node 22 이상
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 427c6622e2d7f501efff957fac5f611d
          workingDirectory: api
          command: deploy
      - name: Health check
        run: curl -fsS --retry 3 --retry-delay 5 https://sshportfolio-chat.tlathgus3466.workers.dev/health
