name = "sshportfolio-chat"
main = "src/index.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# 질문 로그 (KV). 배포 전 `npx wrangler kv namespace create CHAT_LOG` 결과의 id 로 바꾼다.
# 로컬(wrangler dev)은 id 값과 무관하게 로컬 KV 를 쓴다. 이 블록을 지우면 로그 없이 동작한다.
[[kv_namespaces]]
binding = "CHAT_LOG"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
# 허용할 프런트엔드 출처(쉼표 구분). 비우면 모든 출처 허용(개발용).
ALLOWED_ORIGINS = "https://simsohyeon.github.io,http://localhost:5173"
# 사용할 Gemini 모델. 무료 티어 한도가 부족하면 flash-lite 계열로 바꾼다.
GEMINI_MODEL = "gemini-flash-lite-latest"

# GEMINI_API_KEY 는 파일에 쓰지 말고 아래 명령으로 등록한다:
#   npx wrangler secret put GEMINI_API_KEY
