name = "sshportfolio-chat"
main = "src/index.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# 질문 로그 (KV). 배포 전 `npx wrangler kv namespace create CHAT_LOG` 결과의 id 로 바꾼다.
# 로컬(wrangler dev)은 id 값과 무관하게 로컬 KV 를 쓴다. 이 블록을 지우면 로그 없이 동작한다.
[[kv_namespaces]]
binding = "CHAT_LOG"
id = "450b556609e845ecac7039cdf2170fcb"

# Gemini 호출을 미국 리전에서 내보내기 위한 Durable Object (아래 GeminiProxy 참고).
# 방문자가 한국이면 Worker 는 홍콩(HKG)에서 실행되는데, Gemini API 는 홍콩을 지원하지 않아 400 이 난다.
[[durable_objects.bindings]]
name = "GEMINI_PROXY"
class_name = "GeminiProxy"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GeminiProxy"]

# 요청 제한 (Workers Rate Limiting 바인딩, 무료). 넘으면 Gemini 를 호출하지 않고 429.
# RL_IP: 방문자 IP당 60초에 10회. RL_GLOBAL: 전체 합계 60초에 40회 (IP 를 바꿔가며 때려도 Gemini 한도를 지킨다).
# 카운터는 데이터센터별로 따로 돌아서 실제 허용량은 1~3배가 될 수 있다(대략적인 방어).
[[ratelimits]]
name = "RL_IP"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "RL_GLOBAL"
namespace_id = "1002"
simple = { limit = 40, period = 60 }

[vars]
# 허용할 프런트엔드 출처(쉼표 구분). 비우면 모든 출처 허용(개발용).
ALLOWED_ORIGINS = "https://simsohyeon.github.io,http://localhost:5173"
# 사용할 Gemini 모델. 무료 티어 한도가 부족하면 flash-lite 계열로 바꾼다.
GEMINI_MODEL = "gemini-flash-lite-latest"

# GEMINI_API_KEY 는 파일에 쓰지 말고 아래 명령으로 등록한다:
#   npx wrangler secret put GEMINI_API_KEY
